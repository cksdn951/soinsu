<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPOTLIGHT | MUSIC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root { --bg-color: #020408; --glass-bg: rgba(255, 255, 255, 0.015); --glass-border: rgba(255, 255, 255, 0.05); --glass-highlight: rgba(255, 255, 255, 0.08); --text-main: #f5f5f7; --text-sub: #86868b; --accent-color: #2997ff; --modal-bg: rgba(10, 12, 16, 0.85); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", sans-serif; letter-spacing: -0.02em; }
        body { background-color: var(--bg-color); background-image: radial-gradient(at 0% 0%, rgba(41, 151, 255, 0.05) 0px, transparent 40%), radial-gradient(at 100% 0%, rgba(161, 85, 255, 0.04) 0px, transparent 40%), radial-gradient(at 50% 100%, rgba(0, 242, 254, 0.03) 0px, transparent 50%); background-attachment: fixed; color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .floating-back-btn { position: fixed; top: 30px; left: 30px; display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight); border-radius: 30px; color: var(--text-main); font-size: 0.9rem; font-weight: 600; text-decoration: none; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); z-index: 100; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .floating-back-btn:hover { background: rgba(255, 255, 255, 0.08); transform: translateX(-5px); border-color: rgba(255, 255, 255, 0.15); }
        .floating-back-btn svg { width: 18px; height: 18px; }

        header { width: 100%; padding: 80px 20px 40px; text-align: center; }
        header h1 { font-size: 3rem; font-weight: 700; color: #fff; margin-bottom: 28px; }
        .search-box { position: relative; max-width: 480px; margin: 0 auto; }
        .search-box input { width: 100%; padding: 16px 24px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight); border-radius: 14px; color: #fff; font-size: 0.95rem; backdrop-filter: blur(40px); transition: all 0.4s; text-align: center; }
        .search-box input:focus { outline: none; border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 12px 30px rgba(0, 0, 0, 0.4); }
        
        section { width: 100%; max-width: 1140px; padding: 20px; flex-grow: 1; }
        footer { width: 100%; padding: 40px 20px; text-align: center; border-top: 1px solid var(--glass-border); margin-top: 40px; color: var(--text-sub); font-size: 0.9rem;}
        
        .categories { display: flex; justify-content: center; gap: 24px; margin-bottom: 35px; flex-wrap: wrap; }
        .category-btn { background: none; border: none; color: var(--text-sub); font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: color 0.3s ease; }
        .category-btn:hover, .category-btn.active { color: var(--accent-color); font-weight: 600; }
        .category-btn.fav-tab { color: #ff4b4b; }
        .category-btn.fav-tab:hover, .category-btn.fav-tab.active { color: #ff2a2a; }
        
        .tags-filter-section { display: flex; flex-direction: column; gap: 20px; margin-bottom: 50px; padding: 30px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight); border-radius: 20px; backdrop-filter: blur(30px); }
        .tag-group { display: flex; align-items: center; gap: 24px; }
        .tag-group-label { font-size: 0.8rem; color: var(--text-sub); font-weight: 600; min-width: 130px; letter-spacing: 0.02em; }
        .tag-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag-chip { padding: 6px 14px; background: rgba(255, 255, 255, 0.01); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-sub); font-size: 0.8rem; cursor: pointer; transition: all 0.3s; }
        .tag-chip:hover { border-color: rgba(255,255,255,0.15); color: #fff; }
        .tag-chip.active { background: #fff; color: #000; font-weight: 600; }

        .section-title { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: var(--text-sub); margin: 50px 0 20px 0; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .section-title span { color: var(--accent-color); font-weight: 700; font-size: 0.75rem; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
        
        .game-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight); border-radius: 18px; padding: 24px; cursor: pointer; backdrop-filter: blur(20px); transition: all 0.5s; display: flex; flex-direction: column; position: relative; }
        .game-card:hover { transform: translateY(-6px); background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.15); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .game-card-img { width: 100%; aspect-ratio: 1 / 1; background: rgba(255, 255, 255, 0.01); border-radius: 10px; margin-bottom: 18px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.07); font-size: 0.75rem; font-weight: 600; border: 1px solid rgba(255,255,255,0.02); overflow: hidden; }
        
        /* 💖 제목과 하트를 묶어주는 래퍼 스타일 (오류 해결 핵심 부분) */
        .title-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
        .game-card h3 { font-size: 1.15rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; flex-grow: 1; }
        .card-heart { color: #ff4b4b; font-size: 0.95rem; flex-shrink: 0; display: none; }

        .game-card-footer { display: flex; justify-content: space-between; margin-top: auto; font-size: 0.75rem; color: var(--text-sub); font-weight: 500; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: all 0.4s ease; z-index: 1000; padding: 20px; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--modal-bg); border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight); width: 100%; max-width: 580px; padding: 35px; border-radius: 24px; box-shadow: 0 40px 100px rgba(0,0,0,0.5); transform: scale(0.95); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); max-height: 90vh; overflow-y: auto; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        
        .youtube-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 14px; overflow: hidden; margin-bottom: 24px; display: none; border: 1px solid var(--glass-border); }
        .modal-img { width: 100%; height: 140px; background: rgba(255, 255, 255, 0.01); border-radius: 14px; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.02); font-size: 0.8rem; font-weight: 600; overflow: hidden; }
        .modal-content h2 { font-size: 1.8rem; color: #fff; margin-bottom: 12px; font-weight: 700; }
        .modal-desc { color: var(--text-sub); font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; font-weight: 400; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
        .info-item { border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 10px; }
        .info-item span:first-child { display: block; color: var(--text-sub); font-size: 0.8rem; margin-bottom: 4px; font-weight: 500; }
        .info-item span:last-child { color: #fff; font-size: 0.95rem; font-weight: 500; }
        
        .fav-btn { width: 100%; padding: 16px; background: rgba(255,255,255,0.03); color: #fff; border: 1px solid var(--glass-border); border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 0.95rem; margin-bottom: 12px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .close-btn { width: 100%; padding: 16px; background: #fff; color: #000; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; }
        .close-btn:hover { background: #e8e8ed; }
    /* 테마 전환 버튼 (메인 버튼과 디자인 동일, 우측 상단 고정) */
.theme-toggle-btn { position: fixed; top: 30px; right: 30px; display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight); border-radius: 30px; color: var(--text-main); font-size: 0.9rem; font-weight: 600; cursor: pointer; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); z-index: 100; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
.theme-toggle-btn:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.15); }

/* 라이트 모드 전환 시 덮어씌워질 색상 변수들 */
body.light-mode {
    --bg-color: #f0f0f5;
    --text-main: #1d1d1f;
    --text-sub: #55555d;
    --glass-bg: rgba(255, 255, 255, 0.6);
    --glass-border: rgba(0, 0, 0, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.8);
    --modal-bg: rgba(255, 255, 255, 0.9);
}

/* 라이트 모드일 때 글씨 색상 예외 처리 */
body.light-mode header h1,
body.light-mode .search-box input,
body.light-mode .game-card h3,
body.light-mode .modal-content h2,
body.light-mode .info-item span:last-child { color: #000; }

body.light-mode .search-box input::placeholder { color: #888; }
body.light-mode .close-btn { background: #000; color: #fff; }
body.light-mode .close-btn:hover { background: #333; }
body.light-mode .theme-toggle-btn, 
body.light-mode .floating-back-btn { background: rgba(0,0,0,0.05); }</style>
</head>

    <section>

            <button class="category-btn" onclick="selectCategory('인디/어쿠스틱', this)">인디/어쿠스틱</button>

        </div>
    </section>

    <footer>
        &copy; 2026 SPOTLIGHT UNIVERSE. Computer Science Front-End Project.
    </footer>

    <div class="modal-overlay" id="modalOverlay" onclick="closeGameModal(event)">

            <div class="modal-img" id="m-img">ALBUM COVER</div>
            
            <h2 id="m-title">SONG TITLE</h2>
            <p class="modal-desc" id="m-desc">ALBUM INFO</p>
            <div class="info-grid">
                <div class="info-item"><span>ARTIST</span><span id="m-price">-</span></div> 
                <div class="info-item"><span>GENRE</span><span id="m-category">-</span></div>

            </div>
            
            <button id="m-favBtn" class="fav-btn" onclick="toggleFavoriteCurrent()">🤍 즐겨찾기 추가</button>
            <button class="close-btn" onclick="hideModal()">닫기</button>
        </div>
    </div>

        const tagGroupsData = {
            "장르 디테일": ["아이돌", "발라드", "팝", "알앤비", "힙합", "어쿠스틱", "밴드"],
            "무드 / 특징": ["신나는", "감성", "드라이브", "파티", "사랑", "이별", "겨울", "여름"],
            "아티스트 키워드": ["bts", "뉴진스", "아이유", "테일러", "빌보드", "보컬", "듀오"]
        };

        let selectedTags = [];
        let currentCategory = "전체보기";
        let currentOpenedGame = null;

        function initGroupedTags() {
            const container = document.getElementById('tagFilterContainer');
            container.innerHTML = "";
            for (const [groupName, tags] of Object.entries(tagGroupsData)) {
                let groupHTML = `<div class="tag-group"><div class="tag-group-label">${groupName}</div><div class="tag-chips">`;
                tags.forEach(tag => { groupHTML += `<span class="tag-chip" onclick="toggleTag('${tag}', this)"># ${tag}</span>`; });
                groupHTML += `</div></div>`;
                container.innerHTML += groupHTML;
            }
        }

        function toggleTag(tag, element) {
            const index = selectedTags.indexOf(tag);
            if (index > -1) { selectedTags.splice(index, 1); element.classList.remove('active'); } 
            else { selectedTags.push(tag); element.classList.add('active'); }
            filterGames();
        }

        function selectCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            filterGames();
        }

        function filterGames() {
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const favorites = JSON.parse(localStorage.getItem('music_favorites') || '[]');

            if (currentCategory === "즐겨찾기") {
                document.getElementById('perfectSection').style.display = "none";
                document.getElementById('partialSection').style.display = "none";
                document.getElementById('defaultSection').style.display = "block";
                document.getElementById('mainSectionTitle').innerHTML = `MY FAVORITES <span id="defaultCount">0</span>`;
                
                const favGames = gamesData.filter(g => favorites.includes(g.name) && 
                    (searchKeyword === "" || g.name.toLowerCase().includes(searchKeyword) || g.price.toLowerCase().includes(searchKeyword))
                );
                renderToGrid('defaultGrid', 'defaultCount', favGames);
                return;
            }

            document.getElementById('mainSectionTitle').innerHTML = `ALL TRACKS <span id="defaultCount">0</span>`;

            if (selectedTags.length === 0 && searchKeyword === "") {
                document.getElementById('perfectSection').style.display = "none";
                document.getElementById('partialSection').style.display = "none";
                document.getElementById('defaultSection').style.display = "block";
                const baseGames = gamesData.filter(g => currentCategory === "전체보기" || g.category === currentCategory);
                renderToGrid('defaultGrid', 'defaultCount', baseGames);
                return;
            }

            document.getElementById('defaultSection').style.display = "none";
            document.getElementById('perfectSection').style.display = "block";
            document.getElementById('partialSection').style.display = "block";

            let perfectMatches = [], partialMatches = [];

            gamesData.forEach(game => {
                const matchesCategory = (currentCategory === "전체보기" || game.category === currentCategory);
                if (!matchesCategory) return;

                const matchesText = searchKeyword === "" || 
                                    game.name.toLowerCase().includes(searchKeyword) || 
                                    game.price.toLowerCase().includes(searchKeyword) || 
                                    game.category.toLowerCase().includes(searchKeyword) ||
                                    (game.tags && game.tags.some(t => t.toLowerCase().includes(searchKeyword)));
                if (!matchesText) return;

                let matchCount = 0;
                if (selectedTags.length > 0) {
                    selectedTags.forEach(selectedTag => {
                        if (game.tags.includes(selectedTag)) { matchCount++; }
                    });
                } else { matchCount = 999; }

                if (matchCount === 999 || matchCount === selectedTags.length) { perfectMatches.push(game); } 
                else if (matchCount > 0) { partialMatches.push(game); }
            });

            renderToGrid('perfectGrid', 'perfectCount', perfectMatches);
            renderToGrid('partialGrid', 'partialCount', partialMatches);
        }

        // 💖 렌더링 함수 내 HTML 구조 변경 (.title-wrapper 추가)
        function renderToGrid(gridId, countId, gamesArray) {
    const grid = document.getElementById(gridId);
    document.getElementById(countId).innerText = gamesArray.length;
    grid.innerHTML = "";

    if (gamesArray.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:var(--text-sub); padding:30px; font-size:0.85rem;">조건에 일치하는 항목이 없습니다.</p>`;
        return;
    }

    const favorites = JSON.parse(localStorage.getItem('music_favorites') || '[]');

    gamesArray.forEach(game => {
        const safeName = encodeURIComponent(game.name.replace(/[():]/g, '_'));
        const isFav = favorites.includes(game.name);
        const cardHTML = `
            <div class="game-card" onclick="openGameModal(${JSON.stringify(game).replace(/"/g, '&quot;')})">
                <div class="game-card-img">
                    <img src="images/${safeName}.webp" alt="${game.name}" 
                         onerror="if(!this.dataset.tried){this.dataset.tried=true; this.src='images/${safeName}.jpg';}else{this.onerror=null; this.src='https://via.placeholder.com/300x110/1a1d24/86868b?text=No+Image';}"
                         style="width: 100%; height: 100%; object-fit: cover; border-radius: 10px;">
                </div>
                <div class="title-wrapper">
                    <h3>${game.name}</h3>
                    <span class="card-heart" style="display: ${isFav ? 'block' : 'none'}">❤️</span>
                </div>
                <div class="game-card-footer">
                    <span class="tag">${game.category}</span>
                    <span class="price-tag">${game.price}</span>
                </div>
            </div>
        `;
        grid.innerHTML += cardHTML;
    });

    // 💖 카드 렌더링이 모두 끝난 직후 시각 효과 적용!
    initVisualEffects();
}

        function openGameModal(game) {
            currentOpenedGame = game; 
            const safeName = encodeURIComponent(game.name.replace(/[():]/g, '_'));
            const modalImg = document.getElementById('m-img');
            const ytContainer = document.getElementById('m-youtubeContainer');

            if (game.youtubeId) {
                ytContainer.style.display = "block";
                modalImg.style.display = "none";
                // 💖 유튜브 오류 153 해결을 위한 nocookie 및 referrerpolicy 적용 완료!
                ytContainer.innerHTML = `
                    <iframe width="100%" height="100%" 
                            src="https://www.youtube-nocookie.com/embed/${game.youtubeId}?autoplay=1&rel=0" 
                            title="YouTube video player" frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen style="border: none;"
                            referrerpolicy="strict-origin-when-cross-origin">
                    </iframe>`;
            } else {
                ytContainer.style.display = "none";
                ytContainer.innerHTML = "";
                modalImg.style.display = "flex";
                modalImg.innerHTML = `<img src="images/${safeName}.jpg" alt="${game.name}" 
                                           onerror="if(!this.dataset.tried){this.dataset.tried=true; this.src='images/${safeName}.webp';}else{this.onerror=null; this.src='https://via.placeholder.com/580x140/1a1d24/86868b?text=No+Image';}" 
                                           style="width: 100%; height: 100%; object-fit: cover; border-radius: 14px;">`;
            }

            document.getElementById('m-title').innerText = game.name;
            document.getElementById('m-desc').innerText = game.desc;
            document.getElementById('m-price').innerText = game.price;
            document.getElementById('m-category').innerText = game.category;
            document.getElementById('m-date').innerText = game.date;
            document.getElementById('m-multi').innerText = game.multi;
            document.getElementById('m-specs').innerText = game.specs;
            
            updateFavoriteButtonState(); 
            document.getElementById('modalOverlay').classList.add('active');
        }

        function updateFavoriteButtonState() {
            const favBtn = document.getElementById('m-favBtn');
            if (!currentOpenedGame) return;
            
            const favorites = JSON.parse(localStorage.getItem('music_favorites') || '[]');
            if (favorites.includes(currentOpenedGame.name)) {
                favBtn.innerText = "❤️ 즐겨찾기 해제";
                favBtn.style.background = "rgba(255, 75, 75, 0.1)";
                favBtn.style.borderColor = "rgba(255, 75, 75, 0.2)";
                favBtn.style.color = "#ff4b4b";
            } else {
                favBtn.innerText = "🤍 즐겨찾기 추가";
                favBtn.style.background = "rgba(255, 255, 255, 0.03)";
                favBtn.style.borderColor = "var(--glass-border)";
                favBtn.style.color = "#fff";
            }
        }

        function toggleFavoriteCurrent() {
            if (!currentOpenedGame) return;
            
            let favorites = JSON.parse(localStorage.getItem('music_favorites') || '[]');
            const index = favorites.indexOf(currentOpenedGame.name);
            
            if (index > -1) { favorites.splice(index, 1); } 
            else { favorites.push(currentOpenedGame.name); } 
            
            localStorage.setItem('music_favorites', JSON.stringify(favorites));
            
            updateFavoriteButtonState(); 
            filterGames(); 
        }

        function hideModal() { 
            document.getElementById('m-youtubeContainer').innerHTML = ""; 
            document.getElementById('modalOverlay').classList.remove('active'); 
            currentOpenedGame = null;
        }
        
        function closeGameModal(event) { if(event.target === document.getElementById('modalOverlay')) hideModal(); }

        window.onload = () => { initGroupedTags(); filterGames(); initTheme(); };
    // 테마 전환 함수
function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    localStorage.setItem('site_theme', isLight ? 'light' : 'dark');
    document.getElementById('themeBtn').innerText = isLight ? '🌙 다크 모드' : '☀️ 라이트 모드';
}

// 페이지 로드 시 기존 설정된 테마 불러오기
function initTheme() {
    if (localStorage.getItem('site_theme') === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('themeBtn').innerText = '🌙 다크 모드';
    }
}
    // 💖 시각적 퍼포먼스: 3D 틸트 및 스크롤 등장 애니메이션
function initVisualEffects() {
    const cards = document.querySelectorAll('.hub-card, .game-card');
    
    // 1. 스크롤 등장 애니메이션 (Intersection Observer)
    const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const el = entry.target;
                el.style.transition = 'all 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
                
                // 애니메이션이 끝나면 기존 CSS(:hover)와 충돌하지 않도록 인라인 스타일 제거
                setTimeout(() => { 
                    el.style.transition = ''; 
                    el.style.transform = ''; 
                }, 800);
                
                obs.unobserve(el); // 한 번 등장하면 다시 숨지 않게 처리
            }
        });
    }, { threshold: 0.1 });

    cards.forEach(card => {
        // 초기 숨김 상태 세팅
        card.style.opacity = '0';
        card.style.transform = 'translateY(40px)';
        observer.observe(card);

        // 2. 3D 틸트 (입체 글래스) 효과
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left; 
            const y = e.clientY - rect.top;  
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // 마우스 위치에 따른 기울기 계산 (최대 10도)
            const rotateX = ((y - centerY) / centerY) * -10; 
            const rotateY = ((x - centerX) / centerX) * 10;  
            
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-8px) scale3d(1.02, 1.02, 1.02)`;
            card.style.transition = 'none'; // 마우스가 움직일 때는 딜레이 없이 즉각 반응
        });
        
        card.addEventListener('mouseleave', () => {
            card.style.transform = ''; // 마우스가 떠나면 원상복구
            card.style.transition = 'all 0.5s cubic-bezier(0.16, 1, 0.3, 1)'; // 부드럽게 복구
        });
    });
}</script>
