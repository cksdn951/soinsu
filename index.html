<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPOTLIGHT UNIVERSE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-color: #020408;
            --glass-bg: rgba(255, 255, 255, 0.015);
            --glass-border: rgba(255, 255, 255, 0.05);
            --glass-highlight: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7; 
            --text-sub: #86868b;  
            --accent-color: #2997ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.02em; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(41, 151, 255, 0.05) 0px, transparent 40%),
                radial-gradient(at 100% 0%, rgba(161, 85, 255, 0.04) 0px, transparent 40%),
                radial-gradient(at 50% 100%, rgba(0, 242, 254, 0.03) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 💖 테마 전환 버튼 (우측 상단 고정, 글래스모피즘) */
        .theme-toggle-btn { position: fixed; top: 30px; right: 30px; display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight); border-radius: 30px; color: var(--text-main); font-size: 0.9rem; font-weight: 600; cursor: pointer; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); z-index: 100; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .theme-toggle-btn:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.15); }

        /* 💖 라이트 모드 변수 덮어쓰기 */
        body.light-mode {
            --bg-color: #f0f0f5;
            --text-main: #1d1d1f;
            --text-sub: #55555d;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.8);
            --modal-bg: rgba(255, 255, 255, 0.9);
        }

        /* 라이트 모드 예외 색상 처리 */
        body.light-mode header h1,
        body.light-mode .hub-card h2 { color: #000; }
        body.light-mode .theme-toggle-btn { background: rgba(0,0,0,0.05); }

        header { width: 100%; padding: 100px 20px 50px; text-align: center; }
        header h1 { font-size: 3.8rem; font-weight: 800; color: var(--text-main); margin-bottom: 18px; }
        header p { color: var(--text-sub); font-size: 1.15rem; font-weight: 500; }

        section {
            width: 100%; max-width: 1200px; padding: 20px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px;
            flex-grow: 1;
            align-content: center;
        }

        .hub-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight);
            border-radius: 28px; padding: 50px 30px; text-decoration: none; display: flex; flex-direction: column; align-items: center;
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); text-align: center;
        }

        .hub-card:hover { 
            transform: translateY(-12px); background: rgba(255, 255, 255, 0.03); 
            border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 20px 50px rgba(41, 151, 255, 0.15); 
        }
        
        .hub-card h2 { font-size: 2.2rem; color: #fff; margin-bottom: 20px; font-weight: 700; transition: color 0.3s; }
        .hub-card p { color: var(--text-sub); line-height: 1.6; font-size: 1.05rem; transition: color 0.3s; }

        footer { width: 100%; padding: 40px 20px; text-align: center; border-top: 1px solid var(--glass-border); margin-top: 60px; color: var(--text-sub); font-size: 0.9rem; }
    </style>
</head>
<body>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">
        ☀️ 라이트 모드
    </button>

    <header>
        <h1>SPOTLIGHT UNIVERSE</h1>
        <p>가중치 기반 큐레이션 알고리즘을 통한 완벽한 취향 분석</p>
    </header>

    <section>
        <a href="game.html" class="hub-card">
            <h2>GAMES</h2>
            <p>100개의 명작 타이틀과 함께하는<br>전략적인 게이밍 라이프</p>
        </a>
        <a href="movie.html" class="hub-card">
            <h2>MOVIES</h2>
            <p>50편의 글로벌 마스터피스<br>당신의 인생 영화를 찾아보세요</p>
        </a>
        <a href="music.html" class="hub-card">
            <h2>MUSIC</h2>
            <p>50곡의 다채로운 장르<br>플레이리스트를 빛내줄 음악들</p>
        </a>
    </section>

    <footer>
        &copy; 고색고등학교 | 20511 박찬우
    </footer>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('site_theme', isLight ? 'light' : 'dark');
            document.getElementById('themeBtn').innerText = isLight ? '🌙 다크 모드' : '☀️ 라이트 모드';
        }

        function initTheme() {
            if (localStorage.getItem('site_theme') === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeBtn').innerText = '🌙 다크 모드';
            }
        }

        // 페이지 로드 시 테마 초기화 실행
        window.onload = () => { initTheme(); initVisualEffects(); };
    // 💖 시각적 퍼포먼스: 3D 틸트 및 스크롤 등장 애니메이션
function initVisualEffects() {
    const cards = document.querySelectorAll('.hub-card, .game-card');
    
    // 1. 스크롤 등장 애니메이션 (Intersection Observer)
    const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const el = entry.target;
                el.style.transition = 'all 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
                
                // 애니메이션이 끝나면 기존 CSS(:hover)와 충돌하지 않도록 인라인 스타일 제거
                setTimeout(() => { 
                    el.style.transition = ''; 
                    el.style.transform = ''; 
                }, 800);
                
                obs.unobserve(el); // 한 번 등장하면 다시 숨지 않게 처리
            }
        });
    }, { threshold: 0.1 });

    cards.forEach(card => {
        // 초기 숨김 상태 세팅
        card.style.opacity = '0';
        card.style.transform = 'translateY(40px)';
        observer.observe(card);

        // 2. 3D 틸트 (입체 글래스) 효과
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left; 
            const y = e.clientY - rect.top;  
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // 마우스 위치에 따른 기울기 계산 (최대 10도)
            const rotateX = ((y - centerY) / centerY) * -10; 
            const rotateY = ((x - centerX) / centerX) * 10;  
            
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-8px) scale3d(1.02, 1.02, 1.02)`;
            card.style.transition = 'none'; // 마우스가 움직일 때는 딜레이 없이 즉각 반응
        });
        
        card.addEventListener('mouseleave', () => {
            card.style.transform = ''; // 마우스가 떠나면 원상복구
            card.style.transition = 'all 0.5s cubic-bezier(0.16, 1, 0.3, 1)'; // 부드럽게 복구
        });
    });
}</script>
</body>
</html>
