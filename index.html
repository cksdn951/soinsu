<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>Wordflow — 나만의 영어 단어 퀴즈</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color-scheme: light;
      --bg: #f6f7fb; --ink: #172033; --sub: #7a8294; --card: rgba(255,255,255,.88);
      --border: rgba(35,52,90,.09); --soft: #f2f4f9; --accent: #5068f6;
      --accent-soft: #edf0ff; --shadow: 0 20px 60px rgba(35,48,86,.07);
      --good: #139b70; --good-bg: #e7f9f0; --bad: #e65662; --bad-bg: #fff0f1;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0e111a; --ink: #f1f3fa; --sub: #9da6ba; --card: rgba(26,31,45,.94);
      --border: rgba(230,238,255,.09); --soft: #262c3b; --accent: #8a99ff;
      --accent-soft: #303658; --shadow: 0 22px 70px rgba(0,0,0,.22);
      --good: #58d6ab; --good-bg: #193e36; --bad: #ff8390; --bad-bg: #492b35;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); transition: background .25s, color .25s; }
    body::before { content: ""; position: fixed; z-index: -1; width: min(72vw, 1000px); height: 550px; top: -300px; left: 50%; transform: translateX(-50%); background: radial-gradient(ellipse, rgba(111,137,255,.19), transparent 72%); pointer-events: none; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .shell { max-width: 1080px; padding: 0 28px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 0; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 780; letter-spacing: -.6px; font-size: 21px; }
    .mark { width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(135deg,#6e80ff,#7756de); color: white; box-shadow: 0 7px 20px rgba(104,107,242,.24); font-size: 20px; }
    .header-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 9px; }
    .mini-stat { background: var(--card); border: 1px solid var(--border); padding: 9px 13px; border-radius: 13px; font-size: 12px; color: var(--sub); backdrop-filter: blur(12px); white-space: nowrap; }
    .mini-stat strong { margin-left: 5px; color: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
    .icon-button { width: 39px; height: 39px; border-radius: 13px; border: 1px solid var(--border); background: var(--card); color: var(--ink); display: grid; place-items: center; }
    .icon-button:hover { transform: translateY(-1px); }
    .hero { padding: 45px 0 31px; text-align: center; }
    .eyebrow { color: var(--accent); letter-spacing: .15em; font-size: 11px; font-weight: 850; }
    .hero h1 { font-size: clamp(32px,5vw,50px); line-height: 1.23; letter-spacing: -.06em; margin: 13px 0 12px; font-weight: 800; }
    .hero p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub); }
    .quiz { max-width: 770px; margin: 0 auto; padding: 26px 32px 27px; border: 1px solid var(--border); border-radius: 30px; background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(20px); }
    .mode-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 5px; border-radius: 16px; background: var(--soft); }
    .mode-button { border: 0; background: transparent; color: var(--sub); border-radius: 12px; padding: 13px 12px; font-weight: 720; font-size: 13px; transition: .18s; }
    .mode-button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 4px 14px rgba(25,35,70,.09); }
    .progress-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 25px 1px 10px; font-size: 12px; color: var(--sub); font-weight: 650; }
    .progress-meta strong { color: var(--accent); font-variant-numeric: tabular-nums; }
    .progress-track { overflow: hidden; width: 100%; height: 7px; border-radius: 99px; background: var(--soft); }
    .progress-fill { width: 0%; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#6578ff,#9d77f5); transition: width .32s ease; }
    .question { text-align: center; padding: 36px 4px 28px; }
    .question .label { color: var(--sub); font-size: 12px; letter-spacing: .025em; }
    .question h2 { margin: 15px 0 10px; font-size: clamp(26px,4.5vw,40px); font-weight: 800; letter-spacing: -.045em; line-height: 1.33; overflow-wrap: anywhere; }
    .question .source { font-size: 11px; color: var(--sub); opacity: .75; }
    .answers { display: grid; gap: 11px; }
    .option { display: flex; align-items: center; text-align: left; width: 100%; min-height: 65px; gap: 16px; padding: 13px 17px; background: transparent; border: 1.5px solid var(--border); border-radius: 16px; color: var(--ink); font-size: 15px; font-weight: 600; line-height: 1.45; transition: border-color .17s, background .17s, transform .17s; }
    .option:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
    .option:disabled { cursor: default; opacity: 1; }
    .choice-letter { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 10px; background: var(--soft); color: var(--sub); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
    .option.correct { border-color: var(--good); background: var(--good-bg); color: var(--good); }
    .option.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
    .option.correct .choice-letter { background: var(--good); color: #fff; }
    .option.wrong .choice-letter { background: var(--bad); color: #fff; }
    .result { min-height: 50px; margin: 13px 0 5px; font-size: 13px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--sub); line-height: 1.55; }
    .result strong { color: var(--ink); }
    .result.success { color: var(--good); } .result.failure { color: var(--bad); }
    .controls { display: flex; gap: 11px; justify-content: space-between; align-items: center; margin-top: 6px; }
    .secondary, .primary { min-height: 46px; border-radius: 14px; font-weight: 750; font-size: 13px; padding: 0 19px; }
    .secondary { color: var(--sub); border: 1px solid var(--border); background: var(--soft); }
    .secondary:hover:not(:disabled) { color: var(--ink); }
    .secondary:disabled { opacity: .36; cursor: not-allowed; }
    .primary { border: 0; background: linear-gradient(135deg,#526cf8,#7d6aef); color: #fff; box-shadow: 0 8px 18px rgba(91,104,231,.23); }
    .primary:hover:not(:disabled) { filter: brightness(1.06); }
    .primary:disabled { opacity: .36; box-shadow: none; cursor: not-allowed; }
    .below { max-width: 770px; margin: 18px auto 55px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; color: var(--sub); font-size: 12px; }
    .text-button { padding: 8px 1px; color: var(--sub); border: 0; background: transparent; font-size: 12px; font-weight: 700; }
    .text-button:hover { color: var(--accent); }
    kbd { font: inherit; font-size: 11px; background: var(--card); border: 1px solid var(--border); border-radius: 5px; padding: 2px 5px; }
    .finished { min-height: 415px; padding: 50px 10px 22px; text-align: center; }
    .finish-icon { display: grid; place-items: center; width: 72px; height: 72px; margin: auto; border-radius: 24px; font-size: 34px; background: var(--accent-soft); }
    .finished h2 { font-size: 30px; letter-spacing: -.045em; margin: 22px 0 8px; }
    .finished p { color: var(--sub); font-size: 14px; line-height: 1.6; }
    .finish-numbers { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 27px 0; }
    .finish-numbers > div { background: var(--soft); border-radius: 16px; padding: 16px 8px; }
    .finish-numbers strong { display: block; font-size: 25px; font-variant-numeric: tabular-nums; }
    .finish-numbers span { display: block; margin-top: 6px; font-size: 11px; color: var(--sub); }
    .finish-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
    dialog { width: min(650px,calc(100vw - 30px)); max-height: min(85vh,850px); padding: 0; border: 1px solid var(--border); border-radius: 24px; background: var(--card); color: var(--ink); box-shadow: 0 30px 100px rgba(0,0,0,.24); }
    dialog::backdrop { background: rgba(6,10,25,.5); backdrop-filter: blur(7px); }
    .dialog-head { position: sticky; top: 0; z-index: 1; padding: 22px 24px 16px; background: var(--card); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
    .dialog-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 15px; }
    .dialog-top h2 { margin: 0; font-size: 19px; }
    .search { width: 100%; padding: 13px 15px; border: 1px solid var(--border); border-radius: 12px; background: var(--soft); color: var(--ink); outline: none; font-size: 14px; }
    .word-list { padding: 8px 24px 20px; }
    .word-row { display: grid; grid-template-columns: 1fr 1.2fr 43px; align-items: center; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .word-row b { overflow-wrap: anywhere; }
    .word-row span { color: var(--sub); line-height: 1.4; }
    .word-row small { color: var(--sub); text-align: right; }
    .empty { color: var(--sub); text-align: center; padding: 30px 0; }
    @media (max-width:680px) {
      .shell { padding: 0 16px; }
      header { align-items: flex-start; padding: 17px 0 9px; }
      .brand { font-size: 19px; gap: 8px; padding-top: 2px; }
      .mark { width: 34px; height: 34px; border-radius: 11px; }
      .header-actions { max-width: 230px; gap: 5px; }
      .mini-stat { padding: 7px 8px; font-size: 10px; }
      .mini-stat strong { margin-left: 2px; font-size: 11px; }
      .icon-button { width: 33px; height: 33px; border-radius: 11px; }
      .hero { padding: 33px 0 24px; }
      .quiz { padding: 18px 16px 20px; border-radius: 23px; }
      .mode-button { font-size: 12px; padding: 12px 5px; }
      .question { padding: 32px 0 25px; }
      .option { font-size: 14px; min-height: 61px; padding: 12px; gap: 12px; }
      .below { justify-content: center; text-align: center; }
      .below .keyboard-tip { display: none; }
      .word-list { padding: 8px 16px 15px; }
      .word-row { grid-template-columns: 1fr 1.4fr 30px; font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="mark" aria-hidden="true">✦</span><span>Wordflow<span style="color:var(--accent)">.</span></span></div>
      <div class="header-actions" aria-live="polite">
        <span class="mini-stat">정답 <strong id="stat-correct">0/144</strong></span>
        <span class="mini-stat">오답 <strong id="stat-wrong">0</strong></span>
        <span class="mini-stat">스킵 <strong id="stat-skipped">0</strong></span>
        <button class="icon-button" id="theme-toggle" title="다크/라이트 모드 전환" aria-label="색상 모드 변경">☾</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow">YOUR DAILY VOCABULARY</div>
        <h1>단어 공부, 조금 더 즐겁게.</h1>
        <p>사진 속 영어 단어 144개 · 랜덤 4지선다 · 내 속도에 맞춘 학습</p>
      </section>

      <section class="quiz" aria-label="단어 퀴즈">
        <div class="mode-bar" role="tablist" aria-label="문제 유형">
          <button class="mode-button" role="tab" data-mode="ko-en" aria-selected="true">뜻 보고 영단어 맞히기</button>
          <button class="mode-button" role="tab" data-mode="en-ko" aria-selected="false">영단어 보고 뜻 맞히기</button>
        </div>
        <div class="progress-meta"><span id="progress-title">전체 단어</span><span><strong id="progress-count">0 / 144</strong> 완료</span></div>
        <div class="progress-track" role="progressbar" aria-label="학습 진행률" aria-valuemin="0" aria-valuemax="144" aria-valuenow="0" id="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div id="quiz-content"></div>
      </section>

      <div class="below">
        <div><button class="text-button" id="show-words">전체 단어장 보기 ↗</button><span style="margin:0 12px;opacity:.4">·</span><button class="text-button" id="restart">처음부터 다시 섞기 ↻</button></div>
        <span class="keyboard-tip"><kbd>1</kbd>–<kbd>4</kbd> 선택 &nbsp; <kbd>S</kbd> 스킵 &nbsp; <kbd>Enter</kbd> 다음</span>
      </div>
    </main>
  </div>

  <dialog id="words-dialog" aria-label="전체 단어장">
    <div class="dialog-head">
      <div class="dialog-top"><h2>전체 단어장 <span style="font-size:12px;color:var(--sub);font-weight:500">144개</span></h2><button id="close-words" class="icon-button" aria-label="닫기">✕</button></div>
      <input id="search-words" class="search" type="search" placeholder="영어 또는 한국어로 검색" aria-label="단어 검색" />
    </div>
    <div id="word-list" class="word-list"></div>
  </dialog>

  <script>
    "use strict";

    // 사진 5장에 나온 Lesson 4(93~99쪽), Lesson 5(119~125쪽) 전 단어.
    // 한 줄 형식: 교과서 쪽수 | 영어 단어 | 한국어 뜻
    const lesson4 = `
93|cycle|순환
93|accidentally|실수로, 잘못하여
93|damage|~에 손상(손해)을 입히다
93|crack|금이 가다
93|repair|수리하다
93|hesitate|망설이다, 주저하다
93|reasonable|합리적인
93|contribute|기여하다, 이바지하다
94|discard|버리다, 폐기하다
94|electronic|전자의
94|electrical|전기의, 전기를 이용하는
94|appliance|(가정용) 기기
94|toxic|유독성의
94|material|물질, 재료
94|lead|납
94|hazard|위험 (요소)
94|alarming|걱정스러운, 두려운
94|rate|속도
94|generate|발생시키다, 만들어 내다
94|predict|예측(예견)하다
94|address|(문제 등에 대해) 다루다, 고심하다
94|practical|현실성 있는
94|approach|접근법
95|empower|~에게 권한을 부여하다
95|dispose of|~을 버리다, ~을 처리하다
95|disassemble|분해하다
95|manufacturer|제조사(자)
95|intentionally|의도적으로, 일부러
95|acquire|얻다, 습득하다
95|legislation|법률 제정
95|state|명시하다
95|demand|요구하다
95|obtain|얻다, 구하다
95|install|설치하다
95|custom|맞춤의
95|prohibit|금지하다
95|advocate|지지자, 옹호자
95|cause|대의
96|index|지수
96|glance|흘긋 봄, 일견
96|bill|법안
96|lawn mower|잔디 깎는 기계
96|range|~에서 …사이이다
96|take into account|~을 고려하다
96|element|요소
96|spare|여분의
96|label|라벨, 표; 라벨을 붙이다
96|whereas|~에 반하여
97|informed|정보에 근거한
97|landfill|쓰레기 매립지
97|transition|변화
97|sustainable|지속 가능한
97|anticipate|기대하다, 고대하다
97|innovative|혁신적인
98|occur|발생하다
98|staff|~에 직원을 두다
98|neighboring|인접한, 이웃의
98|invaluable|매우 유용한, 귀중한
98|maintenance|보수 관리, 정비
98|extend|연장하다
98|life span|수명
98|foster|조성하다, 발달시키다
98|perspective|관점, 시각
99|limit|제한하다
99|alternatively|그렇지 않으면, 그 대신에`;

    const lesson5 = `
119|ancient|고대의
119|sculpture|조각품
119|archaeology|고고학
119|graduate student|대학원생
119|mark|자국, 흔적
119|marble|대리석
119|ultraviolet|자외선의
119|surface|표면
119|shine|비추다
119|astonished|깜짝 놀란
119|decoration|장식
119|statue|조각상
119|architecture|건축(술)
120|investigate|조사(연구)하다
120|evidence|흔적, 증거
120|trace|흔적, 자취
120|detect|발견하다, 알아내다
120|naked|(몸의 일부가) 노출된
120|undeniable|명백한, 부인할 수 없는
120|bare|아무것도 안 덮인
120|canvas|캔버스
120|vivid|선명한, 강렬한
120|pigment|안료
120|apply|바르다
121|pure|깨끗한, 순수한
121|divine|신성한
121|inaccurate|부정확한, 틀린
121|misconception|오해
121|arise|생기다, 발생하다
121|excavate|발굴하다
121|admire|~을 높이 평가하다
121|wear off|(차츰) 사라지다
121|fade|(색깔이) 바래다
121|plain|장식이 없는
121|marvel|경이로워하다
121|striking|인상적인, 눈에 띄는
121|enhance|향상시키다
121|contrast|(명암·빛깔 등의) 대조
122|dig up|(땅에서) 파내다
122|highlight|강조하다
122|elegant|우아한
122|outline|윤곽
122|reinforce|강화하다
122|scholar|학자
122|associate|연관 짓다
122|exception|예외
123|appreciation|감탄, 감상
123|bias|편견, 편향
123|rooted|정착한, 뿌리 깊은
123|founder|창시자
123|remark|발언하다
123|artifact|공예품
123|firmly|확고히
123|establish|확립하다
123|alter|바뀌다, 바꾸다
123|criticize|비난(비판)하다
123|regard|~을 …으로 여기다
123|inferior|질 낮은, 열등한
123|immature|미숙한
123|insist|주장하다
123|bear|(눈에 보이게) 있다, 지니다
123|civilization|문명
123|noticeable|뚜렷한, 분명한
123|wipe|닦다, 닦아내다
123|beneath|아래[밑]에
123|form|형성되다, 생기다
124|analysis|분석
124|progress|진행되다
124|sufficient|충분한
124|enlighten|깨우치다
124|recreation|개조물, 재현된 것
124|exhibition|전시회
124|replica|(실물을 모방하여 만든) 복제품, 모형
124|plaster|석고
125|transform|바꾸다, 변형시키다
125|objective|객관적인
125|overcome|극복하다
125|pause|잠시 멈추다
125|stereotype|고정관념`;

    const words = [
      ...parseRows(lesson4, 4),
      ...parseRows(lesson5, 5)
    ].map((item, id) => ({...item, id}));

    function parseRows(raw, lesson) {
      return raw.trim().split(/\n/).map(line => {
        const [page, en, ko] = line.split("|");
        if (!page || !en || !ko) throw new Error("단어 데이터 형식을 확인해 주세요: " + line);
        return {lesson, page: Number(page), en: en.trim(), ko: ko.trim()};
      });
    }

    const $ = id => document.getElementById(id);
    const STORAGE_KEY = "wordflow-complete-144-v1";
    const letters = ["A", "B", "C", "D"];

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
    function makeOptions(correctId) {
      const correct = words[correctId];
      const others = shuffle(words.filter(item => item.id !== correctId && item.en !== correct.en && item.ko !== correct.ko));
      return shuffle([correctId, ...others.slice(0, 3).map(w => w.id)]);
    }
    function newSession(ids = words.map(w => w.id), review = false) {
      const queue = shuffle(ids);
      return {queue, cursor: 0, correct: 0, wrong: 0, skipped: 0, missed: [], answer: null, options: queue.length ? makeOptions(queue[0]) : [], review};
    }
    function restore() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!data || !data.sessions) return null;
        for (const key of ["ko-en", "en-ko"]) {
          const s = data.sessions[key];
          if (!s || !Array.isArray(s.queue) || !Array.isArray(s.options) || !Array.isArray(s.missed) ||
              !Number.isInteger(s.cursor) || s.cursor < 0 || s.cursor > s.queue.length ||
              !s.queue.every(id => Number.isInteger(id) && id >= 0 && id < words.length) ||
              new Set(s.queue).size !== s.queue.length ||
              (s.cursor < s.queue.length && (s.options.length !== 4 || !s.options.includes(s.queue[s.cursor])))) return null;
        }
        return data;
      } catch (_) { return null; }
    }
    const saved = restore();
    const state = {
      mode: saved?.mode === "en-ko" ? "en-ko" : "ko-en",
      sessions: saved?.sessions || {"ko-en": newSession(), "en-ko": newSession()},
      theme: saved?.theme === "dark" || saved?.theme === "light" ? saved.theme :
        (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
    };
    const session = () => state.sessions[state.mode];
    function persist() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {} }
    function safe(value) { return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

    function setTheme() {
      document.documentElement.dataset.theme = state.theme;
      $("theme-toggle").textContent = state.theme === "dark" ? "☀" : "☾";
      $("theme-toggle").title = state.theme === "dark" ? "라이트 모드로 전환" : "다크 모드로 전환";
      document.querySelector('meta[name="theme-color"]').content = state.theme === "dark" ? "#0e111a" : "#f6f7fb";
    }

    function render() {
      const s = session();
      const total = s.queue.length;
      const done = s.correct + s.wrong + s.skipped;
      $("stat-correct").textContent = `${s.correct}/${total}`;
      $("stat-wrong").textContent = s.wrong;
      $("stat-skipped").textContent = s.skipped;
      $("progress-title").textContent = s.review ? "오답 · 스킵 다시 풀기" : `전체 ${total}개 단어`;
      $("progress-count").textContent = `${done} / ${total}`;
      $("progress-track").setAttribute("aria-valuemax", total);
      $("progress-track").setAttribute("aria-valuenow", done);
      $("progress-fill").style.width = `${total ? done / total * 100 : 100}%`;
      document.querySelectorAll("[data-mode]").forEach(button => {
        button.setAttribute("aria-selected", String(button.dataset.mode === state.mode));
      });

      if (s.cursor >= total) {
        renderFinished(s);
        persist();
        return;
      }
      const item = words[s.queue[s.cursor]];
      const isKoEn = state.mode === "ko-en";
      const prompt = isKoEn ? item.ko : item.en;
      const definition = isKoEn ? item.en : item.ko;
      $("quiz-content").innerHTML = `
        <div class="question">
          <div class="label">QUESTION ${String(s.cursor+1).padStart(3,"0")}</div>
          <h2>${safe(prompt)}</h2>
          <div class="source">Lesson ${item.lesson} · 교과서 ${item.page}쪽</div>
        </div>
        <div class="answers" role="group" aria-label="네 개의 정답 선택지">
          ${s.options.map((id, idx) => {
            const word = words[id];
            const isCorrect = id === item.id;
            const isPicked = s.answer?.choice === id;
            const style = !s.answer ? "" : isCorrect ? "correct" : isPicked ? "wrong" : "";
            return `<button class="option ${style}" data-answer="${id}" ${s.answer ? "disabled" : ""}>
              <span class="choice-letter">${letters[idx]}</span><span>${safe(isKoEn ? word.en : word.ko)}</span>
            </button>`;
          }).join("")}
        </div>
        <div class="result ${s.answer ? (s.answer.skipped ? "" : s.answer.choice === item.id ? "success" : "failure") : ""}" aria-live="polite">
          ${!s.answer ? "정답이라고 생각하는 선택지를 눌러줘." :
            s.answer.skipped ? `건너뛰었어 · 정답은 <strong>&nbsp;${safe(definition)}&nbsp;</strong>` :
            s.answer.choice === item.id ? "정답! 아주 좋아 ✨" : `아쉬워! 정답은 <strong>&nbsp;${safe(definition)}&nbsp;</strong>`}
        </div>
        <div class="controls">
          <button class="secondary" id="skip" ${s.answer ? "disabled" : ""}>모르겠어요 · 스킵</button>
          <button class="primary" id="next" ${s.answer ? "" : "disabled"}>${s.cursor === total-1 ? "결과 확인 →" : "다음 문제 →"}</button>
        </div>`;
      document.querySelectorAll("[data-answer]").forEach(b => b.addEventListener("click", () => choose(Number(b.dataset.answer))));
      $("skip").addEventListener("click", skipQuestion);
      $("next").addEventListener("click", nextQuestion);
      persist();
    }

    function choose(id) {
      const s = session();
      if (s.answer || s.cursor >= s.queue.length || !s.options.includes(id)) return;
      const correctId = s.queue[s.cursor];
      if (id === correctId) s.correct++;
      else { s.wrong++; s.missed.push(correctId); }
      s.answer = {choice: id, skipped: false};
      render();
    }
    function skipQuestion() {
      const s = session();
      if (s.answer || s.cursor >= s.queue.length) return;
      s.skipped++;
      s.missed.push(s.queue[s.cursor]);
      s.answer = {choice: null, skipped: true};
      render();
    }
    function nextQuestion() {
      const s = session();
      if (!s.answer) return;
      s.cursor++;
      s.answer = null;
      if (s.cursor < s.queue.length) s.options = makeOptions(s.queue[s.cursor]);
      render();
    }
    function renderFinished(s) {
      const total = s.queue.length;
      const accuracy = total ? Math.round(s.correct / total * 100) : 0;
      $("quiz-content").innerHTML = `
        <div class="finished">
          <span class="finish-icon" aria-hidden="true">🏆</span>
          <h2>오늘도 한 걸음 완료!</h2>
          <p>${total}개 문제를 모두 풀었어. 정답률은 <strong>${accuracy}%</strong>야.<br>틀렸거나 스킵한 문제는 다시 도전할 수 있어.</p>
          <div class="finish-numbers">
            <div><strong style="color:var(--good)">${s.correct}</strong><span>정답</span></div>
            <div><strong style="color:var(--bad)">${s.wrong}</strong><span>오답</span></div>
            <div><strong>${s.skipped}</strong><span>스킵</span></div>
          </div>
          <div class="finish-actions">
            ${s.missed.length ? `<button class="secondary" id="retry-missed">오답·스킵 ${s.missed.length}개 복습</button>` : ""}
            <button class="primary" id="retry-all">144개 다시 섞기 ↻</button>
          </div>
        </div>`;
      $("retry-all").addEventListener("click", () => restartMode(false));
      $("retry-missed")?.addEventListener("click", () => {
        state.sessions[state.mode] = newSession([...new Set(s.missed)], true);
        render();
      });
    }
    function restartMode(confirmIfStarted = true) {
      const s = session();
      const hasProgress = s.correct + s.wrong + s.skipped > 0 && s.cursor < s.queue.length;
      if (confirmIfStarted && hasProgress && !confirm("현재 모드의 학습 기록을 초기화하고 다시 섞을까?")) return;
      state.sessions[state.mode] = newSession();
      render();
    }
    function renderWordList(query = "") {
      const needle = query.trim().toLocaleLowerCase();
      const matched = words.filter(w => w.en.toLocaleLowerCase().includes(needle) || w.ko.includes(needle));
      $("word-list").innerHTML = matched.length ? matched.map(w => `<div class="word-row"><b>${safe(w.en)}</b><span>${safe(w.ko)}</span><small>${w.page}쪽</small></div>`).join("") : `<p class="empty">검색 결과가 없어.</p>`;
    }

    document.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => {
      state.mode = button.dataset.mode;
      render();
    }));
    $("theme-toggle").addEventListener("click", () => { state.theme = state.theme === "dark" ? "light" : "dark"; setTheme(); persist(); });
    $("restart").addEventListener("click", () => restartMode(true));
    $("show-words").addEventListener("click", () => {
      $("search-words").value = "";
      renderWordList();
      $("words-dialog").showModal();
    });
    $("close-words").addEventListener("click", () => $("words-dialog").close());
    $("search-words").addEventListener("input", event => renderWordList(event.target.value));
    $("words-dialog").addEventListener("click", event => { if (event.target === $("words-dialog")) $("words-dialog").close(); });
    document.addEventListener("keydown", event => {
      if ($("words-dialog").open || event.altKey || event.ctrlKey || event.metaKey || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
      const s = session();
      if (event.key >= "1" && event.key <= "4" && !s.answer && s.cursor < s.queue.length) {
        event.preventDefault(); choose(s.options[Number(event.key)-1]);
      } else if (event.key.toLowerCase() === "s" && !s.answer) {
        event.preventDefault(); skipQuestion();
      } else if (event.key === "Enter" && s.answer) {
        event.preventDefault(); nextQuestion();
      }
    });
    if (words.length !== 144 || new Set(words.map(w => w.en)).size !== 144) {
      console.error("단어 개수 또는 중복 여부를 확인하세요.", words.length);
    }
    setTheme();
    render();
  </script>
</body>
</html>
